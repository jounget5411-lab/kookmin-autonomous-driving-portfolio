<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">카메라와 LiDAR 융합 주행 구조</title><desc id="desc">센서에서 3채널 BEV를 만들고 상황별 CNN으로 center_path를 생성한 뒤 simple_motion과 CarInterface로 제어합니다. 추월 구간은 본선 V7 고정 조향 블록이라는 예외가 있습니다.</desc><rect x="0" y="0" width="1600" height="1160" rx="0" fill="#F4F6F8" opacity="1"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#FFBE62" opacity="1"/><text x="72" y="67" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="17" fill="#101C2D" font-weight="700" letter-spacing="2" text-anchor="start">02  /  SYSTEM OVERVIEW</text><text x="1528" y="67" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="1" text-anchor="end">CAMERA + LIDAR / BEV / CNN</text><text x="68" y="135" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="45" fill="#101C2D" font-weight="700" letter-spacing="-1" text-anchor="start">센서 융합에서 로컬 경로 생성까지</text><text x="72" y="182" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="22" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">국민대학교 자율주행 경진대회 · 본선 V7 코드 구조</text><line x1="72" y1="212" x2="1528" y2="212" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="72" y="257" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="700" letter-spacing="1.5" text-anchor="start">01</text><text x="116" y="257" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="23" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">입력 → 융합 → 경로</text><rect x="72" y="287" width="340" height="300" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="94" y="308" width="38" height="30" rx="7" fill="#FFBE62" opacity="1"/><text x="113" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">01</text><text x="94" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">카메라·LiDAR</text><text x="94" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="0" text-anchor="start">SENSORS</text><line x1="94" y1="428" x2="390" y2="428" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="94" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">카메라: 차선 분할</text><text x="94" y="493" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">LiDAR: 도로 영역 필터</text><text x="94" y="523" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">점유 정보 투영</text><rect x="444" y="287" width="340" height="300" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="466" y="308" width="38" height="30" rx="7" fill="#FFBE62" opacity="1"/><text x="485" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">02</text><text x="466" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">3채널 BEV</text><text x="466" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="0" text-anchor="start">BIRD’S-EYE VIEW</text><line x1="466" y1="428" x2="762" y2="428" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="466" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">차선·중앙·점유 정보</text><text x="466" y="493" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">128 × 120 격자</text><text x="466" y="523" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">격자당 0.025 m</text><rect x="816" y="287" width="340" height="300" rx="16" fill="#101C2D" opacity="1"/><rect x="838" y="308" width="38" height="30" rx="7" fill="#FFBE62" opacity="1"/><text x="857" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">03</text><text x="838" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#F6F8FA" font-weight="700" letter-spacing="0" text-anchor="start">상황별 경로 모델</text><text x="838" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#FFBE62" font-weight="500" letter-spacing="0" text-anchor="start">MODE-SPECIFIC CNN</text><line x1="838" y1="428" x2="1134" y2="428" stroke="#35465B" stroke-width="1" opacity="1"/><text x="838" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#BDCADA" font-weight="400" letter-spacing="0" text-anchor="start">GENERAL / SHORTCUT</text><text x="838" y="493" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#BDCADA" font-weight="400" letter-spacing="0" text-anchor="start">CONE 모드별 추론</text><text x="838" y="523" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#BDCADA" font-weight="400" letter-spacing="0" text-anchor="start">중앙 경로 생성</text><rect x="1188" y="287" width="340" height="300" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="1210" y="308" width="38" height="30" rx="7" fill="#FFBE62" opacity="1"/><text x="1229" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">04</text><text x="1210" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">로컬 경로 출력</text><text x="1210" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="0" text-anchor="start">/center_path</text><line x1="1210" y1="428" x2="1506" y2="428" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="1210" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">중앙 경로 메시지</text><text x="1210" y="493" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">주행 제어 노드에 전달</text><line x1="412" y1="431" x2="437" y2="431" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 430 425 L 438 431 L 430 437" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><line x1="784" y1="431" x2="809" y2="431" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 802 425 L 810 431 L 802 437" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><line x1="1156" y1="431" x2="1181" y2="431" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 1174 425 L 1182 431 L 1174 437" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><line x1="1358" y1="587" x2="1358" y2="643" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 1352 636 L 1358 644 L 1364 636" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="72" y="639" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="700" letter-spacing="1.5" text-anchor="start">02</text><text x="116" y="639" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="23" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">모드·주행 제어</text><rect x="72" y="672" width="470" height="229" rx="12" fill="#E8EDF2" opacity="1"/><rect x="92" y="696" width="4" height="25" rx="2" fill="#FFBE62" opacity="1"/><text x="109" y="718" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="24" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">주행 모드와 출발 게이트</text><text x="96" y="761" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">신호 분류 + START_R</text><text x="96" y="793" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">현재 상황에 따라 모드 선택</text><text x="96" y="825" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">주행 시작 조건 관리</text><rect x="574" y="672" width="954" height="229" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><text x="601" y="718" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="25" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">경로를 조향·구동 명령으로 변환</text><rect x="601" y="750" width="374" height="70" rx="10" fill="#FFF4E4" opacity="1"/><text x="788" y="792" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="22" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">simple_motion</text><line x1="987" y1="785" x2="1019" y2="785" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 1012 779 L 1020 785 L 1012 791" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="1038" y="750" width="237" height="70" rx="10" fill="#E8EDF2" opacity="1"/><text x="1156" y="792" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="22" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">CarInterface</text><line x1="1287" y1="785" x2="1319" y2="785" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 1312 779 L 1320 785 L 1312 791" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="1338" y="750" width="163" height="70" rx="10" fill="#E8EDF2" opacity="1"/><text x="1419" y="792" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="22" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">모터</text><text x="601" y="863" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">전방 목표의 방향 + 평활화로 제어값 생성 · 20 Hz 설정</text><rect x="72" y="937" width="1456" height="97" rx="12" fill="#E8EDF2" opacity="1"/><text x="98" y="978" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">예외 경로</text><text x="235" y="978" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">본선 V7의 추월 구간은 고정 조향 블록을 사용합니다.</text><text x="235" y="1011" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="18" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">OVERTAKE 모델이 존재하더라도 모든 주행 상황을 CNN이 제어한다고 해석하지 않습니다.</text><line x1="72" y1="1077" x2="1528" y2="1077" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="72" y="1117" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="400" letter-spacing="0" text-anchor=